services:
  postgres:
    container_name: postgresql_container
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phonebook}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-phonebook}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - phonebook_network

  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:7.8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@phonebook.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phonebook_network

  backend:
    container_name: backend_container
    build:
      context: ./back
      dockerfile: PhoneBookApp.WebApi/Dockerfile
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - phonebook_network

networks:
  phonebook_network:
    driver: bridge
